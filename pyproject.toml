[project]
name = "igonometree"
version = "0.1.0"
description = "High-throughput antibody/antigen phylogenetic pipeline"
authors = [{ name = "Thomas Dupic", email = "dupic@ciml.univ-mrs.fr"}]   	 
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "polars>=0.16.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "ete4>=1.1.1",
    "tqdm>=4.64.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["igonometree"]

[tool.setuptools.package-data]
"igonometree" = ["tools/**/**"] 